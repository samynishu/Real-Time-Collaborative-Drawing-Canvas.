<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Collaborative Canvas</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="toolbar">
        <!-- Drawing Tools -->
        <div class="tool-group">
            <label>Tools:</label>
            <button id="tool-brush" class="tool active" title="Freehand Brush">Brush</button>
            <button id="tool-eraser" class="tool" title="Eraser">Eraser</button>
        </div>

        <!-- NEW: Creative Tools -->
        <div class="tool-group">
            <label>Shapes:</label>
            <button id="tool-rect" class="tool" title="Rectangle">⬜</button>
            <button id="tool-circle" class="tool" title="Circle">⭕</button>
            <button id="tool-text" class="tool" title="Insert Text">🅰️</button>
            <!-- Image upload is a label that acts as a button for the hidden file input -->
            <label for="tool-image-upload" class="tool-btn" title="Upload Image">🖼️</label>
            <input type="file" id="tool-image-upload" accept="image/*" style="display: none;">
        </div>

        <!-- Stroke Width -->
        <div class="tool-group">
            <label for="stroke-width">Width:</label>
            <input type="range" id="stroke-width" min="1" max="50" value="5">
            <span id="stroke-width-label">5</span>
        </div>

        <!-- Colors -->
        <div class="tool-group">
            <label for="stroke-color">Color:</label>
            <input type="color" id="stroke-color" value="#000000">
        </div>

        <!-- Actions -->
        <div class="tool-group">
            <label>Actions:</label>
            <button id="action-undo">Undo</button>
            <button id="action-redo">Redo</button>
            <button id="action-clear">Clear</button>
        </div>
    </div>

    <div class="canvas-wrapper">
        <canvas id="drawing-canvas"></canvas>
        <div id="cursor-container"></div>
    </div>

    <div id="user-list">
        <div id="room-info">
            <h3>Loading...</h3>
        </div>
        <h3>Online Users</h3>
        <ul id="users"></ul>
    </div>

    <!-- Join Screen Overlay -->
    <div id="join-screen">
        <div class="join-box">
            <div id="join-menu-view">
                <h2>Welcome!</h2>
                <button id="show-create-btn" class="join-screen-btn">Create a Room</button>
                <button id="show-join-btn" class="join-screen-btn">Join a Room</button>
            </div>

            <div id="create-room-view" style="display: none;">
                <h2>Create a Room</h2>
                <input type="text" id="create-username-input" placeholder="Enter your name" maxlength="20">
                <input type="text" id="create-room-name-input" placeholder="Enter room name (e.g., Art Class)" maxlength="20">
                <button id="create-room-btn" class="join-screen-btn success">Create</button>
                <button id="create-back-btn" class="join-screen-btn secondary">Back</button>
            </div>

            <div id="join-room-view" style="display: none;">
                <h2>Join a Room</h2>
                <input type="text" id="join-username-input" placeholder="Enter your name" maxlength="20">
                <input type="text" id="join-room-id-input" placeholder="Enter Room ID" maxlength="6">
                <button id="join-room-btn" class="join-screen-btn success">Join</button>
                <button id="join-back-btn" class="join-screen-btn secondary">Back</button>
            </div>

            <p id="join-message"></p>
        </div>
    </div>

    <!-- Performance Overlay -->
    <div id="performance-stats">FPS: -- | Ping: --ms</div>

    <!-- Scripts -->
    <script src="/socket.io/socket.io.js"></script>
    <script src="websocket.js"></script>
    <script src="canvas.js"></script>
    <script src="main.js"></script>
</body>
</html>
